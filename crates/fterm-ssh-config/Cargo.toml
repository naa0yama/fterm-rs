# - -------------------------------------------------------------------------------------------------
# - Package
# -
[package]
name = "fterm-ssh-config"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "SSH config parsing and validation for fterm"

# - -------------------------------------------------------------------------------------------------
# - Dependencies
# -
[dependencies]
anyhow.workspace = true
fterm-core = { path = "../fterm-core" }
glob.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

# - -------------------------------------------------------------------------------------------------
# - Dev Dependencies
# -
[dev-dependencies]
fterm-core = { path = "../fterm-core", features = ["testutil"] }
serial_test.workspace = true
tempfile.workspace = true

# - -------------------------------------------------------------------------------------------------
# - Lints
# -
[lints]
workspace = true
